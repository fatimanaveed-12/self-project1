<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye Care Hospital</title>
    <!-- Icons aur Google Fonts -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. RESET & BASE STYLES
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            overflow-x: hidden;
            background-color: #ffffff;
        }

        /* ==========================================================================
           2. NAVIGATION HEADER MENU
           ========================================================================== */
        .site-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0));
            padding: 20px 0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .logo {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
        }

        .logo span {
            color: #00d2d3;
        }

        .main-menu ul {
            display: flex;
            list-style: none;
        }

        .main-menu ul li {
            margin: 0 15px;
        }

        .main-menu ul li a {
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: 0.3s ease;
        }

        .main-menu ul li a:hover,
        .main-menu ul li a.active {
            color: #00d2d3;
        }

        .appointment-btn {
            background-color: #00d2d3;
            color: #ffffff;
            padding: 10px 22px;
            text-decoration: none;
            font-weight: 500;
            border-radius: 5px;
            transition: 0.3s ease;
        }

        .appointment-btn:hover {
            background-color: #1dd1a1;
        }

        /* ==========================================================================
           3. HERO SECTION & FADE BACKGROUND SLIDER
           ========================================================================== */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .banner-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            animation: fadeSlider 15s infinite ease-in-out;
        }

        /* Slide delays for smooth sequential fading */
        .slide:nth-child(1) { animation-delay: 0s; }
        .slide:nth-child(2) { animation-delay: 5s; }
        .slide:nth-child(3) { animation-delay: 10s; }

        @keyframes fadeSlider {
            0% { opacity: 0; }
            10% { opacity: 1; }
            33.33% { opacity: 1; }
            43.33% { opacity: 0; }
            100% { opacity: 0; }
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            text-align: center;
            color: #ffffff;
            padding: 0 20px;
            margin-top: 60px;
        }

        .sub-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00d2d3;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
        }

        .hero-content h1 {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero-content p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 35px;
            color: #f5f5f5;
        }

        .hero-buttons a {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 500;
            margin: 0 10px;
            transition: 0.3s ease;
        }

        .btn-primary {
            background-color: #00d2d3;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #1dd1a1;
        }

        .btn-secondary {
            border: 2px solid #ffffff;
            color: #ffffff;
        }

        .btn-secondary:hover {
            background-color: #ffffff;
            color: #333333;
        }

        /* ==========================================================================
           4. ABOUT US SECTION (CLEAN PREMIUM LAYOUT)
           ========================================================================== */
        .about-section {
            padding: 100px 0;
            background-color: #f1f5f9; /* Soft slate premium background */
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .about-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            gap: 50px;
        }

        .about-content {
            flex: 1;
        }

        .about-section-tag {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #00d2d3;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 12px;
        }

        .about-content h2 {
            font-size: 38px;
            color: #0f172a;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 20px;
        }

        .lead-text {
            font-size: 17px;
            color: #334155;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .about-content p {
            font-size: 15px;
            color: #475569;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .about-features {
            list-style: none;
            margin-bottom: 35px;
            padding: 0;
        }

        .about-features li {
            font-size: 16px;
            color: #0f172a;
            font-weight: 500;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .about-features li i {
            color: #00d2d3;
            font-size: 18px;
        }

        .btn-about {
            display: inline-block;
            background-color: #0f172a;
            color: #ffffff;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: 500;
            border-radius: 6px;
            transition: 0.3s ease;
        }

        .btn-about:hover {
            background-color: #00d2d3;
        }

        /* --- Circle Image Layout --- */
        .about-image-wrapper {
            flex: 1;
            position: relative;
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .circle-frame {
            position: absolute;
            border-radius: 50%;
            overflow: hidden;
            border: 6px solid #ffffff;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            transition: transform 0.4s ease, z-index 0.4s ease, border-color 0.4s ease;
        }

        .circle-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .frame-1 {
            width: 260px;
            height: 260px;
            top: 20px;
            left: 40px;
            z-index: 3;
        }

        .frame-2 {
            width: 220px;
            height: 220px;
            bottom: 30px;
            left: 160px;
            z-index: 2;
        }

        .frame-3 {
            width: 180px;
            height: 180px;
            top: 80px;
            right: 40px;
            z-index: 1;
        }

        .circle-frame:hover {
            transform: scale(1.05);
            z-index: 5;
            border-color: #00d2d3;
        }

        .deco-circle {
            position: absolute;
            width: 320px;
            height: 320px;
            border: 2px dashed #00d2d3;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.2;
            top: 50px;
            left: 80px;
            animation: rotateRing 20s linear infinite;
        }

        @keyframes rotateRing {
            100% { transform: rotate(360deg); }
        }

        /* Responsive Settings */
        @media (max-width: 991px) {
            .nav-container { padding: 0 15px; }
