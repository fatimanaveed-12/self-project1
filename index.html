<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye Care Hospital</title>
    <!-- Google Fonts for premium look -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        /* --- Navigation Menu --- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #0056b3;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: #00a8cc;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            font-size: 16px;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #0056b3;
        }

        /* Underline hover effect */
        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: #00a8cc;
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-btn {
            background: linear-gradient(135deg, #0056b3, #00a8cc);
            color: #fff;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 168, 204, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 168, 204, 0.5);
        }

        /* --- Hero Slider Section --- */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Background Slider Containers */
        .slide-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* Smooth Fade Effect */
        }

        /* Adding a premium dark overlay over images for text readability */
        .slide::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.3));
        }

        .slide.active {
            opacity: 1;
        }

        /* Hero Content */
        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #fff;
            max-width: 800px;
            padding: 0 20px;
            margin-top: 80px; /* Space for fixed navbar */
        }

        .hero-content h1 {
            font-size: 56px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            animation: fadeInUp 1s ease forwards;
        }

        .hero-content p {
            font-size: 18px;
            margin-bottom: 35px;
            opacity: 0.9;
            animation: fadeInUp 1.2s ease forwards;
        }

        .cta-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            animation: fadeInUp 1.4s ease forwards;
        }

        .btn-primary {
            background: #00a8cc;
            color: #white;
            padding: 15px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #0056b3;
            transform: scale(1.05);
        }

        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            padding: 13px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: #fff;
            color: #333;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-links, .nav-btn {
                display: none; /* Can be integrated into a burger menu later */
            }
            .hero-content h1 {
                font-size: 38px;
            }
            .hero-content p {
                font-size: 16px;
            }
            .cta-container {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Navigation Menu -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-eye"></i> OmniEye Care
        </div>
        <ul class="nav-links">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Doctors</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <a href="#" class="nav-btn"><i class="fa-regular fa-calendar-check"></i> Book Appointment</a>
    </header>

    <!-- Hero Slider Section -->
    <section class="hero">
        <div class="slide-container">
            <!-- Aapki Teeno Images Auto Fade Ke Sath -->
            <div class="slide active" style="background-image: url('banner11.jpg');"></div>
            <div class="slide" style="background-image: url('banner12.jpg');"></div>
            <div class="slide" style="background-image: url('banner13.jpg');"></div>
        </div>

        <!-- Attractive Hero Content -->
        <div class="hero-content">
            <h1>Your Vision Is Our Absolute Mission</h1>
            <p>Experience world-class eye care treatments with state-of-the-art technology and our team of expert ophthalmologists.</p>
            <div class="cta-container">
                <a href="#" class="btn-primary">Our Services</a>
                <a href="#" class="btn-secondary">Meet Our Specialists</a>
            </div>
        </div>
    </section>

    <!-- JavaScript for Auto Fade Slider -->
    <script>
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;
        const slideInterval = 4000; // 4 seconds ke baad slide badlegi

        function nextSlide() {
            // Current slide se active class hatao
            slides[currentSlide].classList.remove('active');
            
            // Agli slide par jao
            currentSlide = (currentSlide + 1) % slides.length;
            
            // Nayi slide ko active class do
            slides[currentSlide].classList.add('active');
        }

        // Slider ko automatic start karne ke liye
        setInterval(nextSlide, slideInterval);
    </script>

</body>
</html>
